<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - Hospital Management System</title>
    <link rel="stylesheet" href="STYLE.CSS">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        body::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%); animation: rotate 30s linear infinite; }
        @keyframes rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .logout-container { position: relative; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .logout-box { background: white; border-radius: 20px; padding: 45px 40px; box-shadow: 0 25px 80px rgba(0, 0, 0, 0.35); max-width: 420px; width: 100%; text-align: center; animation: slideUp 0.6s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .logout-icon { width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(135deg, #28a745 0%, #20c997 100%); margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(40, 167, 69, 0.3); }
        .logout-icon i { font-size: 2.5em; color: white; }
        .logout-box h1 { color: #333; font-size: 1.5em; margin-bottom: 15px; }
        .logout-box p { color: #666; font-size: 0.95em; line-height: 1.6; margin-bottom: 25px; }
        .countdown { background: #f0f2f5; padding: 12px 20px; border-radius: 10px; display: inline-flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .countdown i { color: var(--primary-dark); }
        .countdown span { color: var(--primary-dark); font-weight: 600; }
        .btn-primary { width: 100%; background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%); color: white; border: none; padding: 14px; border-radius: 10px; cursor: pointer; font-size: 1em; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.3s; box-shadow: 0 8px 25px rgba(30, 60, 114, 0.35); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(30, 60, 114, 0.45); }
        @media (max-width: 480px) { .logout-box { padding: 30px 25px; } }
    </style>
</head>
<body>
    <div class="logout-container">
        <div class="logout-box">
            <div class="logout-icon"><i class="fas fa-check"></i></div>
            <h1><i class="fas fa-sign-out-alt"></i> Logged Out Successfully</h1>
            <p>You have been securely logged out of the Hospital Management System. Thank you for using our services.</p>
            <div class="countdown">
                <i class="fas fa-clock"></i>
                <span>Redirecting in <span id="countdown">3</span>s...</span>
            </div>
            <a href="LOGIN.HTML" class="btn-primary"><i class="fas fa-sign-in-alt"></i> Login Again</a>
        </div>
    </div>
    <script>
        // Clear login state
        localStorage.removeItem('isLoggedIn');
        localStorage.removeItem('userEmail');
        
        let countdown = 3;
        const el = document.getElementById('countdown');
        setInterval(() => {
            countdown--;
            if (countdown > 0) el.textContent = countdown;
            else window.location.href = 'LOGIN.HTML';
        }, 1000);
    </script>
</body>
</html>
