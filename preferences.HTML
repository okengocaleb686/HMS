<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preferences - Hospital Management System</title>
    <link rel="stylesheet" href="STYLE.CSS">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <img src="IMAGES/HMS.jpg" alt="HMS Logo">
                <p>Hospital Management</p>
            </div>
            <ul class="sidebar-menu">
                <li><a href="DASHBOARD.HTML"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a></li>
                <li><a href="patients.HTML"><i class="fas fa-user-injured"></i> <span>Patients</span></a></li>
                <li><a href="doctors.HTML"><i class="fas fa-user-md"></i> <span>Doctors</span></a></li>
                <li><a href="appointments.HTML"><i class="fas fa-calendar-check"></i> <span>Appointments</span></a></li>
                <li><a href="departments.HTML"><i class="fas fa-hospital"></i> <span>Departments</span></a></li>
                <li><a href="billing.HTML"><i class="fas fa-file-invoice-dollar"></i> <span>Billing</span></a></li>
                <li><a href="reports.HTML"><i class="fas fa-chart-line"></i> <span>Reports</span></a></li>
                <li class="active"><a href="settings.HTML"><i class="fas fa-cog"></i> <span>Settings</span></a></li>
                <li><a href="LOGOUT.HTML"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a></li>
            </ul>
        </div>
        <div class="main-content">
            <div class="header">
                <h1><i class="fas fa-globe"></i> Preferences</h1>
                <div class="user-info">
                    <div id="dashboard-avatar" class="avatar"><i class="fas fa-user"></i></div>
                    <span id="dashboard-username">Admin User</span>
                </div>
            </div>
            <div style="display: grid; grid-template-columns: 220px 1fr; gap: 20px;">
                <div style="background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); height: fit-content;">
                    <div style="padding: 12px; color: #666; border-radius: 8px; display: flex; align-items: center; gap: 10px; font-size: 0.9em; cursor: pointer;" onclick="window.location.href='settings.HTML'"><i class="fas fa-user"></i> Profile</div>
                    <div style="padding: 12px; color: #666; border-radius: 8px; display: flex; align-items: center; gap: 10px; font-size: 0.9em; cursor: pointer;" onclick="window.location.href='hospital.HTML'"><i class="fas fa-hospital"></i> Hospital</div>
                    <div style="padding: 12px; color: #666; border-radius: 8px; display: flex; align-items: center; gap: 10px; font-size: 0.9em; cursor: pointer;" onclick="window.location.href='notifications.HTML'"><i class="fas fa-bell"></i> Notifications</div>
                    <div style="padding: 12px; background: var(--primary-gradient); color: white; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; font-size: 0.9em;"><i class="fas fa-globe"></i> Preferences</div>
                    <div style="padding: 12px; color: #666; border-radius: 8px; display: flex; align-items: center; gap: 10px; font-size: 0.9em; cursor: pointer;" onclick="window.location.href='security.HTML'"><i class="fas fa-shield-alt"></i> Security</div>
                </div>
                <div style="background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); overflow: hidden;">
                    <div style="padding: 20px; border-bottom: 1px solid #f0f0f0;">
                        <h2 style="color: #333; font-size: 1.2em;">System Preferences</h2>
                        <p style="color: #999; font-size: 0.85em;">Customize your experience</p>
                    </div>
                    <div style="padding: 20px;">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                            <div class="form-group">
                                <label>Language</label>
                                <select id="language" style="width: 100%; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.9em;">
                                    <option value="en">English</option>
                                    <option value="es">Spanish</option>
                                    <option value="fr">French</option>
                                    <option value="de">German</option>
                                    <option value="zh">Chinese</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Time Zone</label>
                                <select id="timezone" style="width: 100%; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.9em;">
                                    <option value="UTC">UTC</option>
                                    <option value="EST">Eastern Time (EST)</option>
                                    <option value="CST">Central Time (CST)</option>
                                    <option value="MST">Mountain Time (MST)</option>
                                    <option value="PST">Pacific Time (PST)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Date Format</label>
                                <select id="dateFormat" style="width: 100%; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.9em;">
                                    <option value="MM/DD/YYYY">MM/DD/YYYY</option>
                                    <option value="DD/MM/YYYY">DD/MM/YYYY</option>
                                    <option value="YYYY-MM-DD">YYYY-MM-DD</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Currency</label>
                                <select id="currency" style="width: 100%; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.9em;">
                                    <option value="USD">USD ($)</option>
                                    <option value="EUR">EUR (€)</option>
                                    <option value="GBP">GBP (£)</option>
                                    <option value="JPY">JPY (¥)</option>
                                    <option value="INR">INR (₹)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Theme</label>
                                <select id="theme" style="width: 100%; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.9em;">
                                    <option value="light">Light</option>
                                    <option value="dark">Dark</option>
                                    <option value="auto">Auto</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Items Per Page</label>
                                <select id="itemsPerPage" style="width: 100%; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.9em;">
                                    <option value="10">10</option>
                                    <option value="25">25</option>
                                    <option value="50">50</option>
                                    <option value="100">100</option>
                                </select>
                            </div>
                        </div>
                        <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #f0f0f0; display: flex; justify-content: flex-end; gap: 10px;">
                            <button class="btn-cancel" style="padding: 10px 20px; border: 2px solid #e0e0e0; background: white; border-radius: 8px; cursor: pointer; font-size: 0.9em;" onclick="cancelPreferences()">Cancel</button>
                            <button class="btn-primary" onclick="savePreferences()"><i class="fas fa-save"></i> Save Changes</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script>
window.onload = function() {
    const savedPhoto = localStorage.getItem('profilePhoto');
    if (savedPhoto) {
        const dashboardAvatar = document.getElementById('dashboard-avatar');
        if (dashboardAvatar) {
            dashboardAvatar.innerHTML = '<img src="' + savedPhoto + '" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">';
        }
    }
    const savedSettings = localStorage.getItem('userSettings');
    if (savedSettings) {
        const settings = JSON.parse(savedSettings);
        const fullName = settings.firstName + ' ' + settings.lastName;
        const usernameEl = document.getElementById('dashboard-username');
        if (usernameEl) usernameEl.textContent = fullName;
    }
    const savedPref = localStorage.getItem('preferences');
    if (savedPref) {
        const pref = JSON.parse(savedPref);
        document.getElementById('language').value = pref.language;
        document.getElementById('timezone').value = pref.timezone;
        document.getElementById('dateFormat').value = pref.dateFormat;
        document.getElementById('currency').value = pref.currency;
        document.getElementById('theme').value = pref.theme;
        document.getElementById('itemsPerPage').value = pref.itemsPerPage;
    }
};

function savePreferences() {
    const pref = {
        language: document.getElementById('language').value,
        timezone: document.getElementById('timezone').value,
        dateFormat: document.getElementById('dateFormat').value,
        currency: document.getElementById('currency').value,
        theme: document.getElementById('theme').value,
        itemsPerPage: document.getElementById('itemsPerPage').value
    };
    localStorage.setItem('preferences', JSON.stringify(pref));
    alert('Preferences saved successfully!');
}

function cancelPreferences() {
    const savedPref = localStorage.getItem('preferences');
    if (savedPref) {
        const pref = JSON.parse(savedPref);
        document.getElementById('language').value = pref.language;
        document.getElementById('timezone').value = pref.timezone;
        document.getElementById('dateFormat').value = pref.dateFormat;
        document.getElementById('currency').value = pref.currency;
        document.getElementById('theme').value = pref.theme;
        document.getElementById('itemsPerPage').value = pref.itemsPerPage;
    }
    alert('Changes cancelled');
}
</script>
</html>
