<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Hospital Management System</title>
    <link rel="stylesheet" href="STYLE.CSS">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        body::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%); animation: rotate 30s linear infinite; }
        @keyframes rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .container { position: relative; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: white; border-radius: 20px; padding: 45px 40px; box-shadow: 0 25px 80px rgba(0, 0, 0, 0.35); max-width: 420px; width: 100%; animation: slideUp 0.6s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .logo-section { text-align: center; margin-bottom: 30px; }
        .logo-section img { width: 90px; height: 90px; object-fit: cover; margin-bottom: 15px; border-radius: 18px; box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
        .logo-section h1 { color: #0d6efd; font-size: 1.6em; font-weight: 700; margin-bottom: 5px; }
        .logo-section p { color: #666; font-size: 0.9em; }
        .icon-container { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #ff9800 0%, #ffc107 100%); margin: 0 auto 25px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(255,152,0,0.3); }
        .icon-container i { font-size: 2.2em; color: white; }
        .card h2 { color: #333; font-size: 1.4em; text-align: center; margin-bottom: 15px; }
        .card p { color: #666; text-align: center; font-size: 0.95em; line-height: 1.6; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; font-size: 0.9em; }
        .form-group input { width: 100%; padding: 14px 18px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 1em; transition: all 0.3s; }
        .form-group input:focus { outline: none; border-color: #0d6efd; box-shadow: 0 0 0 3px rgba(13,110,253,0.1); }
        .form-group input::placeholder { color: #999; }
        .btn-primary { width: 100%; background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%); color: white; border: none; padding: 16px; border-radius: 10px; cursor: pointer; font-size: 1em; font-weight: 600; transition: all 0.3s; box-shadow: 0 8px 25px rgba(30, 60, 114, 0.35); display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 12px 35px rgba(30, 60, 114, 0.45); }
        .btn-secondary { width: 100%; background: white; color: #666; border: 2px solid #e0e0e0; padding: 14px; border-radius: 10px; cursor: pointer; font-size: 1em; font-weight: 600; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 12px; }
        .btn-secondary:hover { border-color: #0d6efd; color: #0d6efd; }
        .divider { display: flex; align-items: center; margin: 25px 0; color: #999; font-size: 0.85em; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e0e0e0; }
        .divider span { padding: 0 15px; }
        .features { display: flex; justify-content: center; gap: 20px; margin-top: 25px; padding-top: 25px; border-top: 1px solid #f0f0f0; }
        .feature { display: flex; align-items: center; gap: 8px; color: #999; font-size: 0.8em; }
        .feature i { color: #28a745; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #0d6efd; text-decoration: none; font-size: 0.9em; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; transition: color 0.3s; }
        .back-link a:hover { color: #0a58ca; text-decoration: underline; }
        @media (max-width: 480px) { .card { padding: 30px 25px; } .features { flex-direction: column; gap: 12px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo-section">
                <img src="IMAGES/HMS.jpg" alt="HMS Logo">
                <h1>HMS</h1>
                <p>Hospital Management System</p>
            </div>
            <div class="icon-container"><i class="fas fa-lock-open"></i></div>
            <h2><i class="fas fa-key"></i> Forgot Password?</h2>
            <p>Enter your email address and we'll send you a link to reset your password.</p>
            <form onsubmit="return resetPassword(event)">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" placeholder="Enter your email address" required>
                </div>
                <button type="submit" class="btn-primary"><i class="fas fa-paper-plane"></i> Send Reset Link</button>
            </form>
            <div class="back-link">
                <a href="LOGIN.HTML"><i class="fas fa-arrow-left"></i> Back to Login</a>
            </div>
            <div class="divider"><span>Need Help?</span></div>
            <button class="btn-secondary"><i class="fas fa-headset"></i> Contact Support</button>
            <div class="features">
                <div class="feature"><i class="fas fa-shield-alt"></i> Secure</div>
                <div class="feature"><i class="fas fa-envelope"></i> Email Delivery</div>
                <div class="feature"><i class="fas fa-clock"></i> 24/7 Support</div>
            </div>
        </div>
    </div>
</body>
<script>
function resetPassword(event) {
    event.preventDefault();
    
    const email = document.getElementById('forgotEmail').value;
    const errorDiv = document.getElementById('forgotError');
    const successDiv = document.getElementById('forgotSuccess');
    
    // Check if email exists in localStorage
    const savedSettings = localStorage.getItem('userSettings');
    if (savedSettings) {
        const settings = JSON.parse(savedSettings);
        if (settings.email === email) {
            successDiv.textContent = 'Password reset link sent to ' + email + '!';
            successDiv.style.display = 'block';
            errorDiv.style.display = 'none';
            return false;
        }
    }
    
    // For demo, allow any email
    errorDiv.textContent = 'No account found with this email address.';
    errorDiv.style.display = 'block';
    successDiv.style.display = 'none';
    return false;
}
</script>
</html>
