<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Settings - Hospital Management System</title>
    <link rel="stylesheet" href="STYLE.CSS">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <img src="IMAGES/HMS.jpg" alt="HMS Logo">
                <p>Hospital Management</p>
            </div>
            <ul class="sidebar-menu">
                <li><a href="DASHBOARD.HTML"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a></li>
                <li><a href="patients.HTML"><i class="fas fa-user-injured"></i> <span>Patients</span></a></li>
                <li><a href="doctors.HTML"><i class="fas fa-user-md"></i> <span>Doctors</span></a></li>
                <li><a href="appointments.HTML"><i class="fas fa-calendar-check"></i> <span>Appointments</span></a></li>
                <li><a href="departments.HTML"><i class="fas fa-hospital"></i> <span>Departments</span></a></li>
                <li><a href="billing.HTML"><i class="fas fa-file-invoice-dollar"></i> <span>Billing</span></a></li>
                <li><a href="reports.HTML"><i class="fas fa-chart-line"></i> <span>Reports</span></a></li>
                <li class="active"><a href="settings.HTML"><i class="fas fa-cog"></i> <span>Settings</span></a></li>
                <li><a href="LOGOUT.HTML"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a></li>
            </ul>
        </div>
        <div class="main-content">
            <div class="header">
                <h1><i class="fas fa-hospital"></i> Hospital Settings</h1>
                <div class="user-info">
                    <div id="dashboard-avatar" class="avatar"><i class="fas fa-user"></i></div>
                    <span id="dashboard-username">Admin User</span>
                </div>
            </div>
            <div style="display: grid; grid-template-columns: 220px 1fr; gap: 20px;">
                <div style="background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); height: fit-content;">
                    <div style="padding: 12px; color: #666; border-radius: 8px; display: flex; align-items: center; gap: 10px; font-size: 0.9em; cursor: pointer;" onclick="window.location.href='settings.HTML'"><i class="fas fa-user"></i> Profile</div>
                    <div style="padding: 12px; background: var(--primary-gradient); color: white; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; font-size: 0.9em;"><i class="fas fa-hospital"></i> Hospital</div>
                    <div style="padding: 12px; color: #666; border-radius: 8px; display: flex; align-items: center; gap: 10px; font-size: 0.9em; cursor: pointer;" onclick="window.location.href='notifications.HTML'"><i class="fas fa-bell"></i> Notifications</div>
                    <div style="padding: 12px; color: #666; border-radius: 8px; display: flex; align-items: center; gap: 10px; font-size: 0.9em; cursor: pointer;" onclick="window.location.href='preferences.HTML'"><i class="fas fa-globe"></i> Preferences</div>
                    <div style="padding: 12px; color: #666; border-radius: 8px; display: flex; align-items: center; gap: 10px; font-size: 0.9em; cursor: pointer;" onclick="window.location.href='security.HTML'"><i class="fas fa-shield-alt"></i> Security</div>
                </div>
                <div style="background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); overflow: hidden;">
                    <div style="padding: 20px; border-bottom: 1px solid #f0f0f0;">
                        <h2 style="color: #333; font-size: 1.2em;">Hospital Information</h2>
                        <p style="color: #999; font-size: 0.85em;">Manage hospital details</p>
                    </div>
                    <div style="padding: 20px;">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                            <div class="form-group">
                                <label>Hospital Name</label>
                                <input type="text" id="hospitalName" value="City General Hospital" style="width: 100%; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.9em;">
                            </div>
                            <div class="form-group">
                                <label>Hospital Code</label>
                                <input type="text" id="hospitalCode" value="CGH-001" style="width: 100%; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.9em;">
                            </div>
                            <div class="form-group">
                                <label>Phone</label>
                                <input type="tel" id="hospitalPhone" value="+1 555-0100" style="width: 100%; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.9em;">
                            </div>
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" id="hospitalEmail" value="info@citygeneral.com" style="width: 100%; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.9em;">
                            </div>
                            <div class="form-group" style="grid-column: span 2;">
                                <label>Address</label>
                                <input type="text" id="hospitalAddress" value="123 Medical Center Drive, Healthcare City, HC 12345" style="width: 100%; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.9em;">
                            </div>
                            <div class="form-group">
                                <label>License Number</label>
                                <input type="text" id="licenseNumber" value="LN-2024-123456" style="width: 100%; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.9em;">
                            </div>
                            <div class="form-group">
                                <label>Established Year</label>
                                <input type="text" id="establishedYear" value="1995" style="width: 100%; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.9em;">
                            </div>
                        </div>
                        <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #f0f0f0; display: flex; justify-content: flex-end; gap: 10px;">
                            <button class="btn-cancel" style="padding: 10px 20px; border: 2px solid #e0e0e0; background: white; border-radius: 8px; cursor: pointer; font-size: 0.9em;" onclick="cancelHospital()">Cancel</button>
                            <button class="btn-primary" onclick="saveHospital()"><i class="fas fa-save"></i> Save Changes</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script>
window.onload = function() {
    const savedPhoto = localStorage.getItem('profilePhoto');
    if (savedPhoto) {
        const dashboardAvatar = document.getElementById('dashboard-avatar');
        if (dashboardAvatar) {
            dashboardAvatar.innerHTML = '<img src="' + savedPhoto + '" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">';
        }
    }
    const savedSettings = localStorage.getItem('userSettings');
    if (savedSettings) {
        const settings = JSON.parse(savedSettings);
        const fullName = settings.firstName + ' ' + settings.lastName;
        const usernameEl = document.getElementById('dashboard-username');
        if (usernameEl) usernameEl.textContent = fullName;
    }
    const savedHospital = localStorage.getItem('hospitalSettings');
    if (savedHospital) {
        const hospital = JSON.parse(savedHospital);
        document.getElementById('hospitalName').value = hospital.hospitalName;
        document.getElementById('hospitalCode').value = hospital.hospitalCode;
        document.getElementById('hospitalPhone').value = hospital.hospitalPhone;
        document.getElementById('hospitalEmail').value = hospital.hospitalEmail;
        document.getElementById('hospitalAddress').value = hospital.hospitalAddress;
        document.getElementById('licenseNumber').value = hospital.licenseNumber;
        document.getElementById('establishedYear').value = hospital.establishedYear;
    }
};

function saveHospital() {
    const hospital = {
        hospitalName: document.getElementById('hospitalName').value,
        hospitalCode: document.getElementById('hospitalCode').value,
        hospitalPhone: document.getElementById('hospitalPhone').value,
        hospitalEmail: document.getElementById('hospitalEmail').value,
        hospitalAddress: document.getElementById('hospitalAddress').value,
        licenseNumber: document.getElementById('licenseNumber').value,
        establishedYear: document.getElementById('establishedYear').value
    };
    localStorage.setItem('hospitalSettings', JSON.stringify(hospital));
    alert('Hospital settings saved successfully!');
}

function cancelHospital() {
    const savedHospital = localStorage.getItem('hospitalSettings');
    if (savedHospital) {
        const hospital = JSON.parse(savedHospital);
        document.getElementById('hospitalName').value = hospital.hospitalName;
        document.getElementById('hospitalCode').value = hospital.hospitalCode;
        document.getElementById('hospitalPhone').value = hospital.hospitalPhone;
        document.getElementById('hospitalEmail').value = hospital.hospitalEmail;
        document.getElementById('hospitalAddress').value = hospital.hospitalAddress;
        document.getElementById('licenseNumber').value = hospital.licenseNumber;
        document.getElementById('establishedYear').value = hospital.establishedYear;
    }
    alert('Changes cancelled');
}
</script>
</html>
