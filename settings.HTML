<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Hospital Management System</title>
    <link rel="stylesheet" href="STYLE.CSS">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <img src="IMAGES/HMS.jpg" alt="HMS Logo">
                <p>Hospital Management</p>
            </div>
            <ul class="sidebar-menu">
                <li><a href="DASHBOARD.HTML"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a></li>
                <li><a href="patients.HTML"><i class="fas fa-user-injured"></i> <span>Patients</span></a></li>
                <li><a href="doctors.HTML"><i class="fas fa-user-md"></i> <span>Doctors</span></a></li>
                <li><a href="appointments.HTML"><i class="fas fa-calendar-check"></i> <span>Appointments</span></a></li>
                <li><a href="departments.HTML"><i class="fas fa-hospital"></i> <span>Departments</span></a></li>
                <li><a href="billing.HTML"><i class="fas fa-file-invoice-dollar"></i> <span>Billing</span></a></li>
                <li><a href="reports.HTML"><i class="fas fa-chart-line"></i> <span>Reports</span></a></li>
                <li class="active"><a href="settings.HTML"><i class="fas fa-cog"></i> <span>Settings</span></a></li>
                <li><a href="LOGOUT.HTML"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a></li>
            </ul>
        </div>
        <div class="main-content">
            <div class="header">
                <h1><i class="fas fa-cog"></i> Settings</h1>
                <div class="user-info">
                    <div id="dashboard-avatar" class="avatar"><i class="fas fa-user"></i></div>
                    <span id="dashboard-username">Admin User</span>
                </div>
            </div>
            <div style="display: grid; grid-template-columns: 220px 1fr; gap: 20px;">
                <div style="background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); height: fit-content;">
                    <div style="padding: 12px; background: var(--primary-gradient); color: white; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; font-size: 0.9em;"><i class="fas fa-user"></i> Profile</div>
                    <div style="padding: 12px; color: #666; border-radius: 8px; display: flex; align-items: center; gap: 10px; font-size: 0.9em; cursor: pointer;" onclick="window.location.href='hospital.HTML'"><i class="fas fa-hospital"></i> Hospital</div>
                    <div style="padding: 12px; color: #666; border-radius: 8px; display: flex; align-items: center; gap: 10px; font-size: 0.9em; cursor: pointer;" onclick="window.location.href='notifications.HTML'"><i class="fas fa-bell"></i> Notifications</div>
                    <div style="padding: 12px; color: #666; border-radius: 8px; display: flex; align-items: center; gap: 10px; font-size: 0.9em; cursor: pointer;" onclick="window.location.href='preferences.HTML'"><i class="fas fa-globe"></i> Preferences</div>
                    <div style="padding: 12px; color: #666; border-radius: 8px; display: flex; align-items: center; gap: 10px; font-size: 0.9em; cursor: pointer;" onclick="window.location.href='security.HTML'"><i class="fas fa-shield-alt"></i> Security</div>
                </div>
                <div style="background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); overflow: hidden;">
                    <div style="padding: 20px; border-bottom: 1px solid #f0f0f0;">
                        <h2 style="color: #333; font-size: 1.2em;">Profile Settings</h2>
                        <p style="color: #999; font-size: 0.85em;">Manage your personal information</p>
                    </div>
                    <div style="padding: 20px;">
                        <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 25px;">
                            <div id="profile-photo-container" style="width: 80px; height: 80px; background: var(--primary-gradient); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.8em; font-weight: bold; overflow: hidden;">
                                <img id="profile-photo" src="" alt="Profile Photo" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                                <span id="profile-initials">AU</span>
                            </div>
                            <div>
                                <h3 style="color: #333; font-size: 1.1em;">Admin User</h3>
                                <p style="color: #999; font-size: 0.85em;">Administrator</p>
                                <input type="file" id="photo-upload" accept="image/*" style="display: none;" onchange="handlePhotoUpload(event)">
                                <button class="btn-secondary" style="margin-top: 10px;" onclick="document.getElementById('photo-upload').click()"><i class="fas fa-upload"></i> Upload Photo</button>
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                            <div class="form-group">
                                <label>First Name</label>
                                <input type="text" value="Admin" style="width: 100%; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.9em;">
                            </div>
                            <div class="form-group">
                                <label>Last Name</label>
                                <input type="text" value="User" style="width: 100%; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.9em;">
                            </div>
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" value="admin@hospital.com" style="width: 100%; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.9em;">
                            </div>
                            <div class="form-group">
                                <label>Phone</label>
                                <input type="tel" value="+1 555-0100" style="width: 100%; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.9em;">
                            </div>
                        </div>
                        <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #f0f0f0; display: flex; justify-content: flex-end; gap: 10px;">
                            <button class="btn-cancel" style="padding: 10px 20px; border: 2px solid #e0e0e0; background: white; border-radius: 8px; cursor: pointer; font-size: 0.9em;" onclick="cancelChanges()">Cancel</button>
                            <button class="btn-primary" onclick="saveChanges()"><i class="fas fa-save"></i> Save Changes</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script>
// Store original values for cancel functionality
const originalValues = {
    firstName: 'Admin',
    lastName: 'User',
    email: 'admin@hospital.com',
    phone: '+1 555-0100'
};

let currentPhotoData = null;

function handlePhotoUpload(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const profilePhoto = document.getElementById('profile-photo');
            const profileInitials = document.getElementById('profile-initials');
            profilePhoto.src = e.target.result;
            profilePhoto.style.display = 'block';
            profileInitials.style.display = 'none';
            currentPhotoData = e.target.result;
        };
        reader.readAsDataURL(file);
    }
}

function saveChanges() {
    const firstName = document.querySelector('input[value="Admin"]').value;
    const lastName = document.querySelector('input[value="User"]').value;
    const email = document.querySelector('input[value="admin@hospital.com"]').value;
    const phone = document.querySelector('input[value="+1 555-0100"]').value;
    
    // Save to localStorage
    localStorage.setItem('userSettings', JSON.stringify({
        firstName: firstName,
        lastName: lastName,
        email: email,
        phone: phone
    }));
    
    if (currentPhotoData) {
        localStorage.setItem('profilePhoto', currentPhotoData);
    }
    
    alert('Changes saved successfully!');
}

function cancelChanges() {
    // Reset form fields to original values
    document.querySelector('input[value="Admin"]').value = originalValues.firstName;
    document.querySelector('input[value="User"]').value = originalValues.lastName;
    document.querySelector('input[value="admin@hospital.com"]').value = originalValues.email;
    document.querySelector('input[value="+1 555-0100"]').value = originalValues.phone;
    
    // Reset photo to saved state
    const savedPhoto = localStorage.getItem('profilePhoto');
    const profilePhoto = document.getElementById('profile-photo');
    const profileInitials = document.getElementById('profile-initials');
    
    if (savedPhoto) {
        profilePhoto.src = savedPhoto;
        profilePhoto.style.display = 'block';
        profileInitials.style.display = 'none';
    } else {
        profilePhoto.style.display = 'none';
        profileInitials.style.display = 'block';
    }
    
    currentPhotoData = savedPhoto;
    alert('Changes cancelled');
}

// Check for saved profile photo on page load
window.onload = function() {
    const savedSettings = localStorage.getItem('userSettings');
    if (savedSettings) {
        const settings = JSON.parse(savedSettings);
        document.querySelector('input[value="Admin"]').value = settings.firstName;
        document.querySelector('input[value="User"]').value = settings.lastName;
        document.querySelector('input[value="admin@hospital.com"]').value = settings.email;
        document.querySelector('input[value="+1 555-0100"]').value = settings.phone;
    }
    
    const savedPhoto = localStorage.getItem('profilePhoto');
    if (savedPhoto) {
        const profilePhoto = document.getElementById('profile-photo');
        const profileInitials = document.getElementById('profile-initials');
        profilePhoto.src = savedPhoto;
        profilePhoto.style.display = 'block';
        profileInitials.style.display = 'none';
        currentPhotoData = savedPhoto;
        
        const dashboardAvatar = document.getElementById('dashboard-avatar');
        if (dashboardAvatar) {
            dashboardAvatar.innerHTML = '<img src="' + savedPhoto + '" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">';
        }
    }
    
    const savedUserSettings = localStorage.getItem('userSettings');
    if (savedUserSettings) {
        const settings = JSON.parse(savedUserSettings);
        const fullName = settings.firstName + ' ' + settings.lastName;
        const usernameEl = document.getElementById('dashboard-username');
        if (usernameEl) usernameEl.textContent = fullName;
    }
};
</script>
</html>
